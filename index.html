<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Culture Quiz</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:#203047;font:16px/1.5 Arial}header{background:#1769aa;color:white;text-align:center;padding:20px}main{max-width:1000px;margin:auto;padding:12px}.card{background:white;padding:16px;margin:14px 0;border-radius:12px;border:1px solid #d8e5f0;box-shadow:0 3px 10px #1232}h2{font-size:1.15rem;color:#1769aa}.q{padding:12px 0;border-bottom:1px solid #e5edf4}.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.choice{display:flex;gap:7px;align-items:flex-start;flex:1 1 220px;border:1px solid #d2dfeb;background:#f7faff;border-radius:8px;padding:8px;cursor:pointer}.choice input{margin-top:5px}.fb{background:#f2f6f9;padding:10px;border-radius:8px;margin-top:8px}.good{color:#168148;font-weight:bold}.bad{color:#bf2f2f;font-weight:bold}.trans{background:#fff8dc;border-left:4px solid #e9bf38;padding:9px;margin-top:8px}.score{color:#1769aa;font-weight:bold}button{border:0;border-radius:8px;background:#1769aa;color:white;padding:9px 13px;cursor:pointer;margin:5px 3px}.reset{background:#64748b}.hidden{display:none!important}.login{text-align:center;max-width:420px;margin:25px auto}.login input{font:inherit;padding:10px;width:130px;text-align:center;border:1px solid #abc;border-radius:8px}.sub{color:#68798e;font-style:italic}.tasktag{background:#e5f2ff;color:#14578b;padding:3px 8px;border-radius:6px}@media(max-width:600px){.choice{flex-basis:100%}.card{padding:12px}}

["_____ is the traditional food of the UK.",["Bamboo dancing","Spring rolls","Fish and chips","Spicy rice cakes"],2,"Cá chiên ăn kèm khoai tây chiên là món ăn truyền thống của Vương quốc Anh.","Fish and chips là cá chiên ăn với khoai tây chiên."],
["The annual _____ competition is a highlight of our community event. Each round we need 2 teams to hold both sides of the rope.",["spring rolls","bamboo dancing","tug of war","fish and chips"],2,"Cuộc thi kéo co thường niên là điểm nhấn của sự kiện cộng đồng. Mỗi lượt cần hai đội nắm hai đầu sợi dây.","Tug of war nghĩa là kéo co."],

["Task 4. Complete each sentence with a suitable word from Task 3.",[
["This restaurant is known for this delicious seafood _____ dish.",["cuisine","custom","dish","roots"],2,"Nhà hàng này nổi tiếng với món hải sản ngon tuyệt này.","Dish là món ăn; seafood dish là món hải sản."],
["Good service deserves a fair _____ amount. I tipped the waitress 10 dollars.",["tipping","trend","autograph","festivity"],0,"Dịch vụ tốt xứng đáng được boa một khoản hợp lý. Tôi đã boa cho cô phục vụ 10 đô la.","Tipping là việc boa tiền."],
["_____ has made trying foreign food in your country much easier.",["Globalisation","Cuisine","Souvenir","Custom"],0,"Toàn cầu hóa đã khiến việc thử món ăn nước ngoài ngay tại đất nước bạn dễ dàng hơn nhiều.","Globalisation là toàn cầu hóa."],
["The town is filled with _____ during the holiday season. The atmosphere is so great.",["festivity","autograph","roots","tipping"],0,"Thị trấn tràn ngập không khí lễ hội trong mùa nghỉ lễ. Bầu không khí thật tuyệt vời.","Festivity chỉ hoạt động hoặc không khí lễ hội."],
["The actor gave me his _____ after the show. I was very happy.",["autograph","dish","trend","cuisine"],0,"Nam diễn viên đã tặng tôi chữ ký sau buổi diễn. Tôi rất vui.","Autograph là chữ ký của người nổi tiếng."],
["The wedding ceremony included a traditional cultural _____. The bride had to wear a red dress.",["custom","souvenir","cuisine","autograph"],0,"Lễ cưới bao gồm một phong tục văn hóa truyền thống. Cô dâu phải mặc váy đỏ.","Custom là phong tục, tập quán."],
["The fashion _____ this year is bold and bright colours.",["trend","roots","dish","tipping"],0,"Xu hướng thời trang năm nay là những màu sắc nổi bật và tươi sáng.","Trend là xu hướng."],

["Understanding your family history can help you discover your _____.",["roots","trend","autograph","dish"],0,"Hiểu lịch sử gia đình có thể giúp bạn khám phá cội nguồn của mình.","Roots nghĩa bóng là cội nguồn, gốc gác."],
["I love Japanese _____. Some of my favourite dishes are sushi, ramen and udon.",["cuisine","festivity","tipping","souvenir"],0,"Tôi yêu ẩm thực Nhật Bản. Một số món yêu thích của tôi là sushi, ramen và udon.","Cuisine nghĩa là nền ẩm thực."]
]],
["Task 5. Choose the correct word to complete each sentence.",[
["The restaurant is part of a popular pizza chain / booth. I love the Hawaiian pizza there.",["chain","booth"],0,"Nhà hàng là một phần của chuỗi cửa hàng pizza nổi tiếng. Tôi rất thích pizza Hawaii ở đó.","Chain là chuỗi cửa hàng; booth là quầy/gian hàng."],
["Cultural differences can sometimes lead to characteristic / confusion. In Viet Nam, people drive on the right while in the UK, people drive on the left.",["characteristic","confusion"],1,"Sự khác biệt văn hóa đôi khi có thể dẫn đến nhầm lẫn. Ở Việt Nam lái xe bên phải, trong khi ở Anh lái xe bên trái.","Confusion nghĩa là sự nhầm lẫn."],
["Traditional dances are a captivating feature / costume of this culture.",["feature","costume"],0,"Các điệu múa truyền thống là một nét đặc sắc hấp dẫn của nền văn hóa này.","Feature là đặc điểm/nét đặc sắc; costume là trang phục."],
["This local dish really suits my taste / element. I love everything about it.",["taste","element"],0,"Món ăn địa phương này thực sự hợp khẩu vị của tôi. Tôi thích mọi thứ về nó.","Taste nghĩa là khẩu vị."],
["Mung bean cake or banh dau xanh is a speciality / respect in Hai Duong province.",["speciality","respect"],0,"Bánh đậu xanh là đặc sản của tỉnh Hải Dương.","Speciality là đặc sản."],
["Sushi gained belief / popularity all over the world due to its unique flavour.",["belief","popularity"],1,"Sushi trở nên phổ biến trên khắp thế giới nhờ hương vị độc đáo.","Popularity là sự phổ biến."],
["Cultural heritage plays a crucial role in forming the sale / identity of a country.",["sale","identity"],1,"Di sản văn hóa đóng vai trò quan trọng trong việc hình thành bản sắc của một quốc gia.","Identity là bản sắc."],
["Learning about the origin / lifestyle of customs is fascinating.",["origin","lifestyle"],0,"Tìm hiểu về nguồn gốc của các phong tục thật hấp dẫn.","Origin nghĩa là nguồn gốc."],
["She is a famous culture richness / specialist who studies tribal traditions.",["richness","specialist"],1,"Cô ấy là một chuyên gia nổi tiếng nghiên cứu các truyền thống bộ lạc.","Specialist là chuyên gia."],
["A personal growth / language barrier can be challenging when communicating in a foreign country.",["personal growth","language barrier"],1,"Rào cản ngôn ngữ có thể gây khó khăn khi giao tiếp ở nước ngoài.","Language barrier là rào cản ngôn ngữ."],
["Reduced awareness of traditional customs is a cause / result for alarm for many cultures.",["cause","result"],0,"Việc giảm hiểu biết về phong tục truyền thống là điều đáng báo động đối với nhiều nền văn hóa.","Cụm tiếng Anh chuẩn là “a cause for alarm”; đáp án theo cấu trúc tự nhiên là cause."],
["He got culture diversity / shock when he first moved to the UK. Now he has adapted well.",["diversity","shock"],1,"Anh ấy bị sốc văn hóa khi lần đầu chuyển đến Vương quốc Anh. Giờ đây anh ấy đã thích nghi tốt.","Culture shock là cú sốc văn hóa."],
["This custom is of / on great importance for people in this community.",["of","on"],0,"Phong tục này có tầm quan trọng lớn đối với người dân trong cộng đồng.","Be of great importance là rất quan trọng."]
]],
["Task 6. Choose the correct word to complete each sentence.",[

["This dish announces / blends the flavours from the two different cuisines.",["announces","blends"],1,"Món ăn này hòa quyện hương vị từ hai nền ẩm thực khác nhau.","Blend nghĩa là hòa trộn, kết hợp."],
["People can overcome / consider cultural barriers through communication.",["overcome","consider"],0,"Mọi người có thể vượt qua rào cản văn hóa thông qua giao tiếp.","Overcome barriers là vượt qua rào cản."],
["It’s important to ignore / appreciate the diversity of global cultures.",["ignore","appreciate"],1,"Điều quan trọng là trân trọng sự đa dạng của các nền văn hóa toàn cầu.","Appreciate nghĩa là trân trọng/đánh giá cao."],
["Culture shock reflects / refers to the feeling of anxiety when people are exposed to a new culture.",["reflects","refers"],1,"Sốc văn hóa chỉ cảm giác lo lắng khi mọi người tiếp xúc với một nền văn hóa mới.","Refer to nghĩa là chỉ/đề cập đến."],
["The waitress serves / strengthens us with the most famous local dish.",["serves","strengthens"],0,"Cô phục vụ mang món ăn địa phương nổi tiếng nhất ra cho chúng tôi.","Serve someone food là phục vụ thức ăn cho ai."],
["Many festivals are held to celebrate / captivate the cultural heritage of the community.",["celebrate","captivate"],0,"Nhiều lễ hội được tổ chức để tôn vinh di sản văn hóa của cộng đồng.","Celebrate heritage là tôn vinh di sản."],
["Let’s go to the Vietnamese booth on the rise / in advance. I want to try some spring rolls.",["on the rise","in advance"],1,"Hãy đến gian hàng Việt Nam trước nhé. Tôi muốn thử vài món nem cuốn.","In advance nghĩa là trước."]
]],
["Task 7. Complete each sentence with a suitable verb from the box.",[
["When living in a new place, it’s essential to _____ used to local customs.",["get","take","work","keep"],0,"Khi sống ở một nơi mới, việc làm quen với phong tục địa phương là điều thiết yếu.","Get used to = quen với."],
["People in this area _____ this custom very seriously. You should be careful.",["take","get","work","keep"],0,"Người dân ở khu vực này rất coi trọng phong tục này. Bạn nên cẩn thận.","Take something seriously = coi trọng điều gì."],
["Travelling can _____ up new perspectives on cultural diversity.",["open","keep","take","work"],0,"Du lịch có thể mở ra những góc nhìn mới về sự đa dạng văn hóa.","Open up perspectives = mở ra góc nhìn."],
["Remember to _____ an open mind when experiencing different cultures.",["keep","take","get","work"],0,"Hãy nhớ giữ tư duy cởi mở khi trải nghiệm các nền văn hóa khác nhau.","Keep an open mind = giữ tư duy cởi mở."],
["We should all _____ on how to promote cultural diversity on campus.",["work","take","get","keep"],0,"Tất cả chúng ta nên cùng nỗ lực tìm cách thúc đẩy sự đa dạng văn hóa trong khuôn viên trường.","Work on = nỗ lực thực hiện/cải thiện."],
["It is hard to _____ up with all the new fashion trends.",["keep","take","get","work"],0,"Thật khó để theo kịp tất cả các xu hướng thời trang mới.","Keep up with = theo kịp."]
]],
["Task 9. Complete each sentence with a suitable word from Task 8.",[
["Japanese people love having a _____ dining experience. They sometimes go out to eat alone.",["solo","staple","raw","tasty"],0,"Người Nhật thích trải nghiệm ăn uống một mình. Đôi khi họ ra ngoài ăn một mình.","Solo nghĩa là một mình."],
["Making fun of someone’s cultural practices is _____ and disrespectful.",["insulting","world-famous","professional","extracurricular"],0,"Chế giễu tập quán văn hóa của ai đó là xúc phạm và thiếu tôn trọng.","Insulting nghĩa là xúc phạm."],
["Italian pizza is _____ for its deliciousness. Many people from all over the world love it.",["world-famous","raw","solo","staple"],0,"Pizza Ý nổi tiếng khắp thế giới vì độ ngon. Nhiều người trên toàn thế giới yêu thích món này.","World-famous nghĩa là nổi tiếng toàn thế giới."],
["Rice is _____ food in many Asian cultures. It exists in cuisines of many countries.",["staple","tasty","solo","insulting"],0,"Gạo là lương thực chủ yếu trong nhiều nền văn hóa châu Á. Nó có mặt trong ẩm thực nhiều quốc gia.","Staple food là lương thực/thực phẩm thiết yếu."],
["We have an _____ activity after class. We have to do a project on world cuisine.",["extracurricular","raw","world-famous","solo"],0,"Chúng tôi có một hoạt động ngoại khóa sau giờ học. Chúng tôi phải thực hiện dự án về ẩm thực thế giới.","Extracurricular nghĩa là ngoại khóa."],
["Sushi often features _____ fish as a key ingredient. The fish is fresh and yummy.",["raw","tasty","professional","staple"],0,"Sushi thường có cá sống là nguyên liệu chính. Cá tươi và ngon.","Raw fish là cá sống/chưa nấu chín."],
["The chefs are very _____. They have been in this job for many years.",["professional","insulting","solo","extracurricular"],0,"Các đầu bếp rất chuyên nghiệp. Họ đã làm công việc này nhiều năm.","Professional nghĩa là chuyên nghiệp."],
["The spring rolls you made were very _____. I can’t wait to learn how to make them.",["tasty","raw","staple","world-famous"],0,"Món nem cuốn bạn làm rất ngon. Tôi nóng lòng muốn học cách làm chúng.","Tasty nghĩa là ngon."]
]],
["Task 10. Complete each sentence using the correct form of the word in brackets.",[
["Cultural exchange can _____ certain practices and traditions. (GLOBALISATION)",["globalise","globalisation","globalised","globalising"],0,"Giao lưu văn hóa có thể toàn cầu hóa một số tập quán và truyền thống.","Sau can dùng động từ nguyên mẫu: globalise."],
["Becoming an expert in a specific field makes you a _____. (SPECIAL)",["special","specialist","speciality","specially"],1,"Trở thành chuyên gia trong một lĩnh vực cụ thể khiến bạn trở thành một chuyên gia.","Sau a cần danh từ chỉ người: specialist."],
["Cities often become more culturally diverse due to their _____ populations. (CULTURE)",["culture","cultural","cultured","cultivate"],1,"Các thành phố thường trở nên đa dạng văn hóa hơn nhờ dân cư đa văn hóa.","Cultural là tính từ bổ nghĩa cho populations."],
["The decorations during Diwali festival create a truly _____ atmosphere. (FESTIVITY)",["festivity","festive","festively","festival"],1,"Các đồ trang trí trong lễ hội Diwali tạo nên bầu không khí thực sự đậm chất lễ hội.","Trước atmosphere cần tính từ: festive."],
["The cultural performances at the festival were truly _____. (CAPTIVATE)",["captivate","captivated","captivating","captivation"],2,"Các tiết mục biểu diễn văn hóa tại lễ hội thực sự hấp dẫn.","Captivating mô tả sự vật gây cuốn hút."],
["Traditional clothing can sometimes become a _____ in modern fashion. (TRENDY)",["trend","trendy","trendily","trending"],0,"Trang phục truyền thống đôi khi có thể trở thành một xu hướng trong thời trang hiện đại.","Sau a cần danh từ số ít: trend."],
["It is very _____ of him to make fun of her religion. (INSULT)",["insult","insulting","insulted","insultingly"],1,"Anh ta thật xúc phạm khi chế giễu tôn giáo của cô ấy.","Cấu trúc It is + adjective + of someone + to V."],

const state=raw.map(t=>t[1].map(()=>null));
function unlock(){if(document.getElementById('pw').value==='367'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}else document.getElementById('msg').textContent='Incorrect password. Try again.'}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function draw(){let root=document.getElementById('tasks');root.innerHTML='';raw.forEach((t,ti)=>{let sec=document.createElement('section');sec.className='card';sec.innerHTML=`<span class="tasktag">${t[0].split('.')[0]}</span><h2>${t[0]}</h2><div id="qs${ti}"></div><p class="score" id="score${ti}">Score: 0/${t[1].length}</p><button class="reset" onclick="resetTask(${ti})">Reset this task</button>`;root.appendChild(sec);let qs=sec.querySelector('#qs'+ti);t[1].forEach((q,qi)=>{let d=document.createElement('div');d.className='q';d.innerHTML=`<b>${qi+1}. ${q[0]}</b><div class="opts">${q[1].map((o,oi)=>`<label class="choice" id="o${ti}-${qi}-${oi}"><input type="radio" name="r${ti}-${qi}" value="${oi}" onchange="pick(${ti},${qi},${oi})"><span>${String.fromCharCode(65+oi)}. ${o}</span></label>`).join('')}</div><div id="f${ti}-${qi}" class="fb hidden"></div>`;qs.appendChild(d)})})}
function pick(ti,qi,oi){if(state[ti][qi]!==null)return;state[ti][qi]=oi;let q=raw[ti][1][qi],ok=oi===q[2];document.querySelectorAll(`input[name="r${ti}-${qi}"]`).forEach(x=>x.disabled=true);q[1].forEach((_,j)=>{let el=document.getElementById(`o${ti}-${qi}-${j}`);if(j===q[2])el.style.borderColor='#168148';if(j===oi&&!ok)el.style.borderColor='#bf2f2f'});let f=document.getElementById(`f${ti}-${qi}`);f.classList.remove('hidden');f.innerHTML=`<span class="${ok?'good':'bad'}">${ok?'Đúng!':'Chưa đúng.'}</span><br><b>Đáp án:</b> ${q[1][q[2]]}<br><b>Giải thích:</b> ${q[4]}<div class="trans"><b>Nghĩa tiếng Việt cả câu:</b> ${q[3]}</div>`;score(ti)}
function score(ti){let done=0,correct=0;state[ti].forEach((v,i)=>{if(v!==null){done++;if(v===raw[ti][1][i][2])correct++}});document.getElementById('score'+ti).textContent=`Score: ${correct}/${raw[ti][1].length} (${done} answered)`}
function resetTask(ti){state[ti]=raw[ti][1].map(()=>null);draw()}
draw();
</script></body></html>
